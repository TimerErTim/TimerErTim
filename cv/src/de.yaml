jobs:
  - position: Softwareentwickler
    company:
      name: opta data Österreich GmbH
      link: https://www.optadata.at/
    location: Linz, Oberösterreich
    description:
      - Als einer von drei Kernentwicklern eine Diabetes-Bestellplattform von Grund auf konzipiert und umgesetzt
      - An der Planung und Vorbereitung der Ablösung des bestehenden Kernsystems sowie an der Umsetzung der neuen Plattform mitgewirkt
      - Zentrale Komponenten wie Autorisierung, Observability und Analytik aufgebaut
    from: "2024 Jun."
    to: "heute"
    tags:
      - Systementwurf
      - Domain-Driven Design
      - Zusammenarbeit im Scrum-Team

  - position: Praktikum
    company:
      name: opta data Österreich GmbH
      link: https://www.optadata.at/
    location: Linz, Oberösterreich
    description:
      - Ein Berichtswerkzeug entwickelt, um Veränderungen und Qualitätsverluste des unternehmensinternen KI-Modells zur Texterkennung im Produktivbetrieb zu erkennen
      - Auf Grundlage der Modellarchitektur einen Autoencoder zur Dokumentenklassifizierung trainiert
      - Die Ergebnisse den Stakeholdern vorgestellt
    from: "2022 Jul."
    to: "2022 Aug."
    tags:
      - Datenanalyse
      - Datenvisualisierung
      - Berichtserstellung
      - Deep Learning

