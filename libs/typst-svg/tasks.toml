#:schema https://mise.en.dev/schema/mise-task.json
# Post-processing for typst-ts-cli svg_html output (> 0.7.0-rc2).
# Add a new versioned helper when output format changes; keep typst-ts-cli in consumer mise.toml aligned.

["process_svg_typsttscli_gt0.7.0-rc2"]
description = "Extract root <svg> and inline typst-ts-cli >0.7.0-rc2 base64 embeds"
usage = 'arg "<file>" help="The target SVG file to process"'
run = "python3 \"{{ vars.REPO_ROOT }}/libs/typst-svg/scripts/process_svg_typsttscli_gt0.7.0-rc2.py\""
